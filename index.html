<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="عبدالله الحنكاوي — الملف الشخصي الرقمي" />
  <title>عبدالله الحنكاوي — Digital Profile</title>
  <style>
    :root {
      --color-apple-blue: #0071e3;
      --color-link-blue: #0066cc;
      --color-signal-blue: #2997ff;
      --color-carbon: #1d1d1f;
      --color-frost: #f5f5f7;
      --color-ice: #f4f8fb;
      --color-smoke: #333333;
      --color-graphite: #474747;
      --color-ash: #707070;
      --color-mist: #858585;
      --color-onyx: #000000;
      --color-pebble: #e2e2e5;
      --font-sf-pro-display: 'SF Pro Display', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-sf-pro-text: 'SF Pro Text', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --text-caption: 12px;
      --text-body-sm: 14px;
      --text-body: 17px;
      --text-subheading: 21px;
      --text-heading-sm: 28px;
      --text-heading: 40px;
      --text-heading-lg: 44px;
      --text-display: 56px;
      --font-weight-light: 300;
      --font-weight-regular: 400;
      --font-weight-semibold: 600;
      --spacing-4: 4px;
      --spacing-8: 8px;
      --spacing-12: 12px;
      --spacing-16: 16px;
      --spacing-20: 20px;
      --spacing-24: 24px;
      --spacing-40: 40px;
      --spacing-48: 48px;
      --radius-lg: 8px;
      --radius-full: 980px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sf-pro-text);
      font-size: var(--text-body);
      line-height: 1.47;
      letter-spacing: -0.016em;
      color: var(--color-carbon);
      background: #ffffff;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate { animation-fill-mode: both; }
    .animate--fade-up { animation-name: fadeInUp; }
    .animate--fade { animation-name: fadeIn; }
    .animate--scale { animation-name: scaleIn; }
    .duration--400 { animation-duration: 0.4s; }
    .duration--600 { animation-duration: 0.6s; }
    .duration--800 { animation-duration: 0.8s; }
    .delay--100 { animation-delay: 0.1s; }
    .delay--200 { animation-delay: 0.2s; }
    .delay--300 { animation-delay: 0.3s; }
    .delay--400 { animation-delay: 0.4s; }
    .ease--out { animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }

    /* ── Sticky Top Bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--color-pebble);
    }
    .topbar__inner {
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar__name {
      font-size: var(--text-body-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-carbon);
    }
    .topbar__label {
      font-size: var(--text-caption);
      color: var(--color-ash);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ── Main Content ── */
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ── Hero Section ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 72px 24px 56px;
      text-align: center;
    }
    .hero__eyebrow {
      font-size: var(--text-caption);
      color: var(--color-ash);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .hero__avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      background: var(--color-pebble);
    }
    .hero__avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .hero__name {
      font-family: var(--font-sf-pro-display);
      font-size: clamp(36px, 6vw, 52px);
      font-weight: var(--font-weight-semibold);
      line-height: 1.07;
      letter-spacing: 0.011em;
      color: var(--color-carbon);
      margin-bottom: 8px;
    }
    .hero__descriptor {
      font-size: var(--text-subheading);
      font-weight: var(--font-weight-light);
      color: var(--color-ash);
      margin-bottom: 28px;
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--color-apple-blue);
      color: #ffffff;
      font-size: var(--text-body);
      font-weight: var(--font-weight-regular);
      padding: 12px 28px;
      border-radius: var(--radius-full);
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 113, 227, 0.25);
    }
    .hero__cta:hover {
      background: #0077ed;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3);
    }
    .hero__cta:active {
      background: #006edb;
      transform: translateY(0);
    }
    .hero__cta svg { width: 20px; height: 20px; }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--color-pebble);
      margin: 0;
    }

    /* ── Social Links Section ── */
    .social {
      padding: 40px 0;
    }
    .social__heading {
      font-size: var(--text-body-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-ash);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 16px;
      text-align: center;
    }
    .social__list {
      display: flex;
      flex-direction: column;
    }
    .social__item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--color-pebble);
      text-decoration: none;
      color: var(--color-carbon);
      transition: background 0.15s ease;
      border-radius: var(--radius-lg);
    }
    .social__item:last-child { border-bottom: none; }
    .social__item:hover { background: var(--color-ice); }
    .social__info {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .social__icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--color-frost);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .social__icon svg { width: 18px; height: 18px; color: var(--color-graphite); }
    .social__text {
      display: flex;
      flex-direction: column;
    }
    .social__name {
      font-size: var(--text-body);
      font-weight: var(--font-weight-regular);
    }
    .social__handle {
      font-size: var(--text-body-sm);
      color: var(--color-ash);
    }
    .social__arrow {
      color: var(--color-mist);
      font-size: 16px;
      transition: transform 0.15s ease;
    }
    .social__item:hover .social__arrow { transform: translateX(-2px); }

    /* ── Save Contact Section ── */
    .save {
      padding: 40px 0 56px;
      display: flex;
      justify-content: center;
    }
    .save__btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--color-link-blue);
      font-size: var(--text-body);
      font-weight: var(--font-weight-regular);
      padding: 12px 28px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-link-blue);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .save__btn:hover {
      background: var(--color-link-blue);
      color: #ffffff;
    }
    .save__btn svg { width: 18px; height: 18px; }

    /* ── Footer ── */
    .footer {
      padding: 24px 24px 40px;
      text-align: center;
      border-top: 1px solid var(--color-pebble);
    }
    .footer__text {
      font-size: var(--text-caption);
      color: var(--color-ash);
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .hero { padding: 48px 16px 40px; }
      .hero__avatar { width: 104px; height: 104px; }
      main { padding: 0 16px; }
      .topbar__inner { padding: 10px 16px; }
    }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }
  </style>
</head>

  <script>
    // vCard generation and download
    (function() {
      const vcard = [
        'BEGIN:VCARD',
        'VERSION:3.0',
        'FN:عبدالله الحنكاوي',
        'N:الحنكاوي;عبدالله;;;',
        'TEL;TYPE=CELL,VOICE:+9647708865247',
        'URL:https://wa.me/9647708865247',
        'END:VCARD'
      ].join('\r\n');

      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      document.getElementById('saveContact').addEventListener('click', function() {
        const a = document.createElement('a');
        a.href = url;
        a.download = 'abdullah-al-hankawi.vcf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    })();
  </script>
