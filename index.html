<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="عبدالله الحنكاوي — الملف الشخصي الرقمي" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>عبدالله الحنكاوي — Digital Profile</title>
  <style>
    :root {
      --c-blue: #0071e3;
      --c-blue-hover: #0077ed;
      --c-link: #0066cc;
      --c-carbon: #1d1d1f;
      --c-ash: #707070;
      --c-pebble: #e2e2e5;
      --c-frost: #f5f5f7;
      --c-ice: #f4f8fb;
      --c-mist: #858585;

      /* Brand colors */
      --ig-pink: #E1306C;
      --ig-purple: #833AB4;
      --ig-orange: #F77737;
      --tt-black: #010101;
      --tt-cyan: #69C9D0;
      --tt-pink: #EE1D52;
      --sc-yellow: #FFFC00;
      --sc-black: #000000;
      --fb-blue: #1877F2;

      --font: 'SF Pro Text', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-d: 'SF Pro Display', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --r-full: 980px;
      --r-card: 12px;
      --r-icon: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.47;
      letter-spacing: -0.016em;
      color: var(--c-carbon);
      background: linear-gradient(180deg, #f8f9fb 0%, #f0f2f5 50%, #fafbfc 100%);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Keyframes ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
    @keyframes pop { 0% { transform:scale(1); } 50% { transform:scale(1.12); } 100% { transform:scale(1); } }
    @keyframes slideInRight { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }
    @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
    @keyframes pulse { 0%,100% { opacity:0.6; } 50% { opacity:1; } }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .anim { animation-fill-mode: both; }
    .anim-fu { animation-name: fadeUp; }
    .anim-fi { animation-name: fadeIn; }
    .anim-si { animation-name: scaleIn; }
    .anim-sr { animation-name: slideInRight; }
    .d-300 { animation-duration: 0.35s; }
    .d-400 { animation-duration: 0.45s; }
    .d-500 { animation-duration: 0.55s; }
    .d-600 { animation-duration: 0.7s; }
    .delay-1 { animation-delay: 0.08s; }
    .delay-2 { animation-delay: 0.16s; }
    .delay-3 { animation-delay: 0.24s; }
    .delay-4 { animation-delay: 0.32s; }
    .delay-5 { animation-delay: 0.40s; }
    .delay-6 { animation-delay: 0.48s; }
    .ease { animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }

    /* ── Top Bar ── */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.72);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .topbar__inner {
      max-width: 980px; margin: 0 auto;
      padding: 10px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .topbar__name { font-size: 14px; font-weight: 600; color: var(--c-carbon); }
    .topbar__label {
      font-size: 11px; color: var(--c-ash);
      letter-spacing: 0.06em; text-transform: uppercase;
      font-weight: 500;
    }

    /* ── Main ── */
    main { max-width: 980px; margin: 0 auto; padding: 0 24px; }

    /* ── Hero ── */
    .hero {
      display: flex; flex-direction: column; align-items: center;
      padding: 64px 24px 48px; text-align: center;
    }
    .hero__eyebrow {
      font-size: 11px; color: var(--c-ash);
      letter-spacing: 0.1em; text-transform: uppercase;
      font-weight: 500; margin-bottom: 16px;
    }
    .hero__avatar-ring {
      width: 132px; height: 132px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c, #fda085);
      background-size: 300% 300%;
      animation: gradientShift 6s ease infinite;
      margin-bottom: 20px;
    }
    .hero__avatar {
      width: 126px; height: 126px;
      border-radius: 50%; overflow: hidden;
      background: #fff;
    }
    .hero__avatar img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .hero__name {
      font-family: var(--font-d);
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 600; line-height: 1.07;
      letter-spacing: 0.01em; color: var(--c-carbon);
      margin-bottom: 6px;
    }
    .hero__descriptor {
      font-size: 20px; font-weight: 300; color: var(--c-ash);
      margin-bottom: 24px;
    }

    /* ── WhatsApp CTA ── */
    .hero__cta {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff; font-size: 17px; font-weight: 500;
      padding: 12px 28px; border-radius: var(--r-full);
      border: none; cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 16px rgba(37,211,102,0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hero__cta:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(37,211,102,0.4); }
    .hero__cta:active { transform: translateY(0) scale(0.97); }
    .hero__cta svg { width: 22px; height: 22px; }

    /* ── Social ── */
    .social { padding: 32px 0; }
    .social__heading {
      font-size: 13px; font-weight: 600; color: var(--c-ash);
      letter-spacing: 0.06em; text-transform: uppercase;
      margin-bottom: 12px; text-align: center;
    }
    .social__list { display: flex; flex-direction: column; gap: 0; }

    /* ── Social Item ── */
    .social__item {
      display: flex; align-items: center;
      padding: 14px 16px;
      border-radius: var(--r-card);
      text-decoration: none; color: var(--c-carbon);
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      position: relative; overflow: hidden;
      margin-bottom: 4px;
      min-height: 64px;
      cursor: pointer;
    }
    .social__item::before {
      content: ''; position: absolute; inset: 0;
      border-radius: var(--r-card); opacity: 0;
      transition: opacity 0.2s ease;
    }
    .social__item:active { transform: scale(0.97); }

    /* Instagram */
    .social__item--ig { background: linear-gradient(135deg, rgba(131,58,180,0.06), rgba(225,48,108,0.06), rgba(247,119,55,0.06)); border: 1px solid rgba(131,58,180,0.12); }
    .social__item--ig:active { background: linear-gradient(135deg, rgba(131,58,180,0.12), rgba(225,48,108,0.12), rgba(247,119,55,0.12)); }

    /* TikTok */
    .social__item--tt { background: rgba(1,1,1,0.04); border: 1px solid rgba(1,1,1,0.08); }
    .social__item--tt:active { background: rgba(1,1,1,0.08); }

    /* Snapchat */
    .social__item--sc { background: rgba(255,252,0,0.06); border: 1px solid rgba(255,252,0,0.2); }
    .social__item--sc:active { background: rgba(255,252,0,0.12); }

    /* Facebook */
    .social__item--fb { background: rgba(24,119,242,0.05); border: 1px solid rgba(24,119,242,0.12); }
    .social__item--fb:active { background: rgba(24,119,242,0.1); }

    /* Icon containers */
    .social__icon {
      width: 44px; height: 44px;
      border-radius: var(--r-icon);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative; z-index: 1;
    }
    .social__item:active .social__icon { transform: scale(0.9); }

    /* Instagram icon */
    .social__item--ig .social__icon { background: linear-gradient(135deg, #833AB4, #E1306C, #F77737); }
    .social__item--ig .social__icon svg { color: #fff; }

    /* TikTok icon */
    .social__item--tt .social__icon { background: #010101; }
    .social__item--tt .social__icon svg { color: #fff; }

    /* Snapchat icon */
    .social__item--sc .social__icon { background: #FFFC00; }
    .social__item--sc .social__icon svg { color: #000; }

    /* Facebook icon */
    .social__item--fb .social__icon { background: #1877F2; }
    .social__item--fb .social__icon svg { color: #fff; }

    .social__icon svg { width: 20px; height: 20px; }

    .social__text {
      display: flex; flex-direction: column;
      flex: 1; margin-right: 14px; position: relative; z-index: 1;
    }
    .social__name { font-size: 16px; font-weight: 600; color: var(--c-carbon); }
    .social__handle { font-size: 13px; color: var(--c-ash); }

    .social__arrow {
      color: var(--c-mist); font-size: 18px;
      transition: transform 0.2s ease, color 0.2s ease;
      position: relative; z-index: 1;
    }
    .social__item:active .social__arrow { transform: translateX(-4px); color: var(--c-carbon); }

    /* Ripple effect */
    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(0,0,0,0.08);
      transform: scale(0); animation: ripple-effect 0.5s ease-out forwards;
      pointer-events: none; z-index: 2;
    }
    @keyframes ripple-effect {
      to { transform: scale(4); opacity: 0; }
    }

    /* ── Save Contact ── */
    .save { padding: 24px 0 48px; display: flex; justify-content: center; }
    .save__btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--c-link);
      font-size: 17px; font-weight: 500;
      padding: 12px 28px; border-radius: var(--r-full);
      border: 1.5px solid var(--c-link);
      cursor: pointer; text-decoration: none;
      transition: all 0.2s ease;
    }
    .save__btn:hover { background: var(--c-link); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,102,204,0.25); }
    .save__btn:active { transform: scale(0.97); }
    .save__btn svg { width: 18px; height: 18px; }

    /* ── Footer ── */
    .footer {
      padding: 20px 24px 36px; text-align: center;
      border-top: 1px solid var(--c-pebble);
    }
    .footer__text { font-size: 11px; color: var(--c-ash); }

    /* ── Mobile ── */
    @media (max-width: 640px) {
      .hero { padding: 44px 16px 36px; }
      .hero__avatar-ring { width: 112px; height: 112px; }
      .hero__avatar { width: 106px; height: 106px; }
      .hero__descriptor { font-size: 18px; }
      main { padding: 0 16px; }
      .topbar__inner { padding: 10px 16px; }
      .social__item { padding: 12px 14px; min-height: 58px; }
      .social__icon { width: 40px; height: 40px; }
      .hero__cta { padding: 14px 32px; font-size: 18px; }
    }

    /* ── Reduced Motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  </main>

  <footer class="footer">

  </footer>

  <script>
    // vCard download
    (function() {
      const vcard = [
        'BEGIN:VCARD','VERSION:3.0',
        'FN:عبدالله الحنكاوي','N:الحنكاوي;عبدالله;;;',
        'TEL;TYPE=CELL,VOICE:+9647708865247',
        'URL:https://wa.me/9647708865247',
        'END:VCARD'
      ].join('\r\n');
      const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      document.getElementById('saveContact').addEventListener('click', function() {
        const a = document.createElement('a');
        a.href = url; a.download = 'abdullah-al-hankawi.vcf';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    })();

    // Touch ripple effect on social items
    (function() {
      const items = document.querySelectorAll('.social__item');
      items.forEach(function(item) {
        item.addEventListener('click', function(e) {
          const rect = item.getBoundingClientRect();
          const ripple = document.createElement('span');
          ripple.className = 'ripple';
          const size = Math.max(rect.width, rect.height);
          ripple.style.width = ripple.style.height = size + 'px';
          ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
          ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
          item.appendChild(ripple);
          setTimeout(function() { ripple.remove(); }, 500);
        });
      });
    })();
  </script>
